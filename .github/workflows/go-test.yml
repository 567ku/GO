name: Go Tests with Race Detector

on:
  push:
    branches: [ main, dev, feature/* ]
  pull_request:
    branches: [ main, dev ]

env:
  GOTOOLCHAIN: local  # P0: 禁止toolchain自动升级，强制使用workflow指定版本

jobs:
  test:
    name: Test with Race Detector
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        go-version: ['1.22.0']  # P0: 固定版本，与go.mod保持一致
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ matrix.go-version }}
        check-latest: false  # P0: 禁止自动升级
        cache: true
    
    - name: Verify Go version
      run: |
        echo "=== Go Version Verification ==="
        go version
        go env GOTOOLCHAIN
        echo "=== Checking go.mod ==="
        cat go.mod | grep "^go " || true
        echo "=== Version Check ==="
        GO_VERSION=$(go version | awk '{print $3}' | sed 's/go//')
        echo "Actual Go version: $GO_VERSION"
        echo "Expected Go version: ${{ matrix.go-version }}"
        if [[ ! "$GO_VERSION" =~ ^${{ matrix.go-version }} ]]; then
          echo "ERROR: Go version mismatch!"
          exit 1
        fi
        echo "\u2705 Version verification passed"
    
    - name: Install dependencies
      run: |
        # 安装build-essential（包含gcc）
        sudo apt-get update
        sudo apt-get install -y build-essential
        
        # 验证gcc安装
        gcc --version
        
        # 下载Go依赖
        go mod download
    
    - name: Run tests without race detector
      run: |
        echo "Running normal tests..."
        go test -v -count=1 ./pkg/...
    
    - name: Run tests with race detector
      env:
        CGO_ENABLED: 1
      run: |
        echo "Running tests with race detector..."
        go test -race -v -count=1 ./pkg/...
    
    - name: Run Reconnect stress test
      run: |
        echo "Running Reconnect stress test (count=50)..."
        go test ./pkg/engine -run "TestEngine_ReconnectToReconciling|TestReconcile_Reconnected" -count=50
    
    - name: Run go vet
      run: |
        echo "Running go vet..."
        go vet ./pkg/...
    
    - name: Check formatting
      run: |
        echo "Checking code formatting..."
        if [ "$(gofmt -s -l ./pkg | wc -l)" -gt 0 ]; then
          echo "Code is not formatted. Please run: gofmt -s -w ./pkg"
          gofmt -s -l ./pkg
          exit 1
        fi
